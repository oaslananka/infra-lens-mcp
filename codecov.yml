codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - tests
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - tests

github_checks:
  annotations: true

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  tests:
    paths:
      - src/
    carryforward: false

ignore:
  - test/**
  - scripts/**
  - docs/**
  - examples/**
