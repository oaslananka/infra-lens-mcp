name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Dead code check
        run: pnpm run check:dead-code

      - name: Unit tests
        run: pnpm test

      - name: Threat-model abuse cases
        run: pnpm run test:abuse

      - name: Observability export contract
        run: pnpm run test:observability

      - name: Build
        run: pnpm run build

      - name: Golden incident fixtures
        run: pnpm run check:golden

      - name: Performance regression gate
        run: pnpm run test:perf

      - name: Release state evaluator tests
        run: pnpm run test:release-state

      - name: Dependency and coverage automation policy
        run: |
          pnpm run check:renovate
          pnpm run check:codecov
          pnpm run check:container-release
          pnpm run check:overrides

      - name: API docs drift check
        run: pnpm run docs:api:check

      - name: MCP metadata check
        run: pnpm run check:metadata
        env:
          CHECK_METADATA_REQUIRE_DIST: 'true'

      - name: Package dry run
        run: npm pack --dry-run

      - name: Package size budget
        run: pnpm run check:package-size

  full:
    name: Full Gates Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          use_oidc: true
          files: coverage/lcov.info,coverage/cobertura-coverage.xml
          disable_search: true
          flags: tests
          name: node-24
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          use_oidc: true
          files: reports/junit/jest.xml
          disable_search: true
          report_type: test_results
          flags: tests
          name: node-24-tests
          fail_ci_if_error: false
          verbose: true

      - name: Build
        run: pnpm run build

      - name: Package dry run
        run: npm pack --dry-run

  node-canary:
    name: Node 26 Compatibility (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Package dry run
        run: npm pack --dry-run

  host-compatibility:
    name: Host Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: MCP metadata check
        run: pnpm run check:metadata
        env:
          CHECK_METADATA_REQUIRE_DIST: 'true'

      - name: Package dry run
        run: npm pack --dry-run

  docker:
    name: Docker Build Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t infra-lens-mcp:ci .

      - name: CLI smoke
        run: docker run --rm --entrypoint node infra-lens-mcp:ci -e "import('better-sqlite3').then(() => console.log('runtime ok'))"

      - name: Hardened read-only runtime smoke
        run: |
          set -euo pipefail
          volume="infra-lens-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${volume}" >/dev/null
          trap 'docker volume rm --force "${volume}" >/dev/null' EXIT
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount type=volume,src="${volume}",dst=/home/appuser/.infra-lens-mcp \
            --entrypoint node \
            infra-lens-mcp:ci \
            -e "import('./dist/db.js').then(({ getDatabase, closeAllDatabases }) => { getDatabase(); closeAllDatabases(); console.log('hardened runtime ok'); }).catch((error) => { console.error(error); process.exitCode = 1; })"

  ssh-e2e:
    name: SSH E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run SSH e2e tests
        run: pnpm run test:e2e
