name: Publish npm

on:
  repository_dispatch:
    types: [infra-lens-release]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or branch to validate without publishing.
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.event.client_payload.tag || inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate npm package
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, and pack
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run test:coverage
          pnpm run build
          pnpm run check:licenses
          pnpm run test:release-state
          CHECK_METADATA_REQUIRE_DIST=true pnpm run check:metadata
          npm pack --dry-run

      - name: Summarize validation-only run
        run: echo "Manual dispatch is validation-only and cannot publish npm artifacts." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish npm package
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: npm-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.client_payload.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: node scripts/verify-release-event.mjs

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package metadata
        id: pkg
        run: |
          set -euo pipefail
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release version is unpublished
        run: |
          set -euo pipefail
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} already exists on npm" >&2
            exit 1
          fi

      - name: Test and build
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run test:coverage
          pnpm run build
          pnpm run check:licenses
          pnpm run test:release-state

      - name: Metadata check
        run: pnpm run check:metadata
        env:
          CHECK_METADATA_REQUIRE_DIST: 'true'

      - name: Pack package
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --json | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Attest package artifact
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.1
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
