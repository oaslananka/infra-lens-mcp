name: Publish GHCR Image

on:
  repository_dispatch:
    types: [infra-lens-release]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without pushing.
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: publish-ghcr-${{ github.event.client_payload.tag || inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate GHCR image build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}:validation
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Summarize validation-only run
        run: echo "Manual dispatch is build-only and cannot push GHCR images." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GHCR image
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.client_payload.tag }}

      - name: Verify canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: node scripts/verify-release-event.mjs

      - name: Read package version
        id: pkg
        run: |
          set -euo pipefail
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "name=$(node -p "require('./package.json').name")"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=latest
            type=raw,value=${{ github.event.client_payload.tag }}
          labels: |
            org.opencontainers.image.title=infra-lens-mcp
            org.opencontainers.image.description=Infrastructure visibility and diagnostics MCP server
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.pkg.outputs.version }}
            org.opencontainers.image.revision=${{ steps.pkg.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=Infrastructure visibility and diagnostics MCP server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.pkg.outputs.version }}
            org.opencontainers.image.revision=${{ steps.pkg.outputs.revision }}

      - name: Publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless image signature
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Summarize image
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SIGNATURE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          {
            echo "Image: ghcr.io/${GITHUB_REPOSITORY}"
            echo "Package: ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Digest: ${IMAGE_DIGEST}"
            echo "SBOM: attached as a BuildKit OCI attestation"
            echo "Provenance: BuildKit mode=max plus GitHub artifact attestation"
            echo "Signature identity: ${SIGNATURE_IDENTITY}"
          } >> "$GITHUB_STEP_SUMMARY"
