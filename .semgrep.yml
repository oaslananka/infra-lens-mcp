rules:
  - id: infra-lens.no-eval
    message: Dynamic code execution is prohibited in runtime and maintenance code.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: infra-lens.no-child-process-exec
    message: Use spawn/execFile with an argument array instead of shell-based child_process.exec.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: require("node:child_process").exec(...)
          - pattern: require("child_process").exec(...)
          - patterns:
              - pattern-inside: |
                  import { ..., exec, ... } from "node:child_process";
                  ...
              - pattern: exec(...)
          - patterns:
              - pattern-inside: |
                  import { ..., exec, ... } from "child_process";
                  ...
              - pattern: exec(...)

  - id: infra-lens.no-shell-true
    message: shell=true reintroduces command-injection risk; execute a binary with an explicit argument array.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: '$RUNNER(..., { ..., shell: true, ... }, ...)'

  - id: infra-lens.no-disabled-tls-verification
    message: TLS certificate verification must not be disabled.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: '{ ..., rejectUnauthorized: false, ... }'

  - id: infra-lens.no-secret-environment-logging
    message: Do not write secret-bearing environment variables to logs.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-regex: '(?i)(console\.|logger\.)[^\n]*(process\.env\.[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|API_KEY))'

  - id: infra-lens.http.authorization-direct-equality
    message: Compare bearer authorization values with the constant-time helper.
    severity: ERROR
    languages: [typescript]
    paths:
      include: [/src/**/*.ts]
    patterns:
      - pattern: $AUTHORIZATION === $EXPECTED
      - metavariable-regex:
          metavariable: $AUTHORIZATION
          regex: ^authorization$

  - id: infra-lens.http.gateway-secret-direct-equality
    message: Compare gateway secrets with the constant-time helper.
    severity: ERROR
    languages: [typescript]
    paths:
      include: [/src/**/*.ts]
    pattern: $VALUE === $CONFIG.gatewaySecret

  - id: infra-lens.no-tls-environment-bypass
    message: Do not disable TLS certificate verification in source code or automation.
    severity: ERROR
    languages: [generic]
    paths:
      include: [/src/**, /scripts/**, /.github/workflows/**, /Dockerfile*]
    pattern-regex: >-
      (?i)NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*["']?0

  - id: infra-lens.ssh.no-host-key-bypass
    message: StrictHostKeyChecking=no is forbidden outside disposable external fixtures.
    severity: ERROR
    languages: [generic]
    paths:
      include: [/src/**, /scripts/**, /.github/workflows/**, /Dockerfile*]
    pattern-regex: >-
      (?i)StrictHostKeyChecking\s*=\s*no
